name: Keep Render Alive
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping socket server
        run: |
          curl -sf "${{ vars.SOCKET_URL }}/health" || echo "Ping failed"
